<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul" xmlns:html="http://www.w3.org/1999/xhtml">
  <groupbox>
    <html:h2>Tidal</html:h2>
    <html:p>在 Zotero 中连接 PDF、原文与译文。支持段落定位、智能保留参考文献、断点续译和译文回存。</html:p>
    <button label="打开 Tidal 设置…" oncommand="Zotero.Tidal.openSettings();"/>
    <html:p>选择 PDF 或文献条目后，右键选择“翻译论文 PDF…”。在 PDF 阅读器中选择文字后，也可点击“翻译选区”。</html:p>
    <html:p>全文翻译会将 PDF 发送到你配置的 MinerU 服务，文本发送到翻译服务；服务可能收费。API 凭证保存在 Zotero 登录管理器中。</html:p>
  </groupbox>
</vbox>
